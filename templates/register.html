{% extends "base.html" %}

{% block title %}Create Account — ShopEase{% endblock %}

{% block content %}

<section class="auth">

    <div class="auth-art">
        <span>✦</span>
        <h2>Make it<br>yours.</h2>
        <p>Create an account to save your orders and shop faster.</p>
    </div>

    <form method="post" class="auth-form">

        {% csrf_token %}

        <span class="eyebrow">JOIN SHOPEASE</span>

        <h1>Create account</h1>

        <p>It only takes a minute.</p>

        <label>
            Name
            <input
                type="text"
                name="username"
                placeholder="Enter your name"
                required
            >
        </label>

        <label>
            Email
            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >
        </label>

        <label>
            Password
            <input
                type="password"
                name="password"
                minlength="6"
                placeholder="Create a password"
                required
            >
        </label>

        <button class="btn primary wide">
            Create Account →
        </button>

        <small>
            Already have an account?
            <a href="{% url 'login' %}">Sign in</a>
        </small>

    </form>

</section>

{% endblock %}
